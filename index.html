<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Yard Check</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2312100E'/><rect x='6' y='7' width='20' height='18' rx='2' fill='none' stroke='%23FFB000' stroke-width='2'/><path d='M10 13h12M10 17h12M10 21h7' stroke='%23FFB000' stroke-width='2'/></svg>">
<style>
:root{
  --bg:#12100E; --surface:#1B1815; --raised:#252119; --line:#332E27;
  --ink:#F2EDE4; --dim:#A39A8C; --faint:#6E655A;
  --amber:#FFB000; --amber-deep:#B87A00; --red:#E23D28; --green:#4FA96A; --blue:#5B8FC7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,p{margin:0}

header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.gpschip{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--faint);white-space:nowrap;flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis}
.gpschip.good{color:var(--green);border-color:#1e3d29}
.gpschip.ok{color:var(--amber);border-color:#4a3a12}
.gpschip.bad{color:var(--red);border-color:#4a1a12}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);flex:none}
.icon:active{background:var(--raised)}

main{padding:12px 14px;max-width:640px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);margin:18px 0 9px;display:flex;align-items:center;gap:10px}
.eyebrow:first-child{margin-top:0}
.eyebrow::after{content:"";flex:1;height:1px;background:#221E1A}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}

.readout{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:9px;position:relative;overflow:hidden}
.readout::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.readout.ready::before{background:var(--amber)}
.readout .line{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700}
.readout .digits{font-family:ui-monospace,Menlo,monospace;font-size:44px;font-weight:700;
  letter-spacing:.06em;line-height:1.05;min-height:46px}
.readout .digits.ghost{color:var(--faint);font-weight:400}
.readout .meta{font-size:12px;color:var(--dim);margin-top:6px}
.flag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;margin-top:8px}
.flag.warn{background:#3a2c08;color:var(--amber)}
.flag.dupe{background:#3a1410;color:#ff8f7d}
.flag.new{background:#12301f;color:var(--green)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.pad button{min-height:56px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:600}
.pad button:active{background:var(--amber);color:#1a1200}
.pad .fn{font-size:13px;font-weight:700;font-family:inherit;color:var(--dim)}

.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick.three{grid-template-columns:repeat(3,1fr)}
.pick.two{grid-template-columns:repeat(2,1fr)}
.pick button{min-height:50px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:700;color:var(--dim);padding:5px 3px;line-height:1.25}
.pick button.on{border-color:var(--amber);background:#221a08;color:var(--amber)}
.pick small{display:block;font-size:10px;font-weight:600;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
  font-size:13px;color:var(--dim);white-space:nowrap}
.chip.on{background:#221a08;border-color:var(--amber);color:var(--amber);font-weight:700}

.ticks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tick{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;text-align:left;font-size:13px;font-weight:700}
.tick .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--faint);flex:none;
  display:grid;place-items:center;font-size:15px;color:transparent}
.tick.on{border-color:var(--amber);background:#221a08;color:var(--amber)}
.tick.on .box{border-color:var(--amber);color:var(--amber)}

label.f{display:block;margin-bottom:11px}
label.f .lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  display:block;margin-bottom:6px;font-weight:700}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:13px 12px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--amber)}
textarea{min-height:58px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;
  border-radius:12px;font-size:16px;font-weight:800;background:var(--amber);color:#1a1200}
.btn:active{background:var(--amber-deep)}
.btn[disabled]{background:var(--raised);color:var(--faint)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.ghost:active{background:var(--raised)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.sm{min-height:46px;font-size:14px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:8px;margin-top:10px}

.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:54px;
  padding:10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  position:relative;overflow:hidden}
.row:active{background:var(--raised)}
.row+.row{margin-top:6px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.row.k-loaded::before{background:var(--green)}
.row.k-empty::before{background:var(--faint)}
.row.k-roll::before{background:var(--blue)}
.row.k-waste::before{background:var(--red)}
.row .ln{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--faint);
  min-width:22px;text-align:right}
.row .body{flex:1;min-width:0}
.row .t{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700}
.row .s{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint);text-align:right;white-space:nowrap}
.row.gone{opacity:.5}
.row.due{border-color:#5a2a12}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;flex:1}
.stat .n{font-family:ui-monospace,Menlo,monospace;font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

.camwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;
  aspect-ratio:4/3;border:1px solid var(--line);margin-bottom:10px}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:7%;right:7%;top:31%;height:38%;border:2px solid var(--amber);
  border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.3)}
.camnote{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;text-align:center;
  font-size:12.5px;color:var(--dim);background:linear-gradient(transparent,rgba(0,0,0,.85))}

.empty{text-align:center;padding:32px 16px;color:var(--faint);font-size:14px}
.empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:5px;font-weight:600}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
.warn{border:1px solid #4a3a12;background:#1d1707;border-radius:11px;padding:11px 13px;
  font-size:12.5px;color:#e8c98a;line-height:1.5;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;
  font-weight:700;z-index:200;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.5)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(18,16,14,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;position:relative}
nav button.on{color:var(--amber)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav .badge{position:absolute;top:4px;right:50%;margin-right:-24px;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;
  place-items:center;padding:0 4px}

.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);
  display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:19px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--dim);margin-bottom:16px}
pre.out{white-space:pre;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:12px;overflow-x:auto;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.cell{aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px}
.cell .cn{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;color:var(--faint)}
.cell .ct{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--amber);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.taken{background:var(--raised);border-color:var(--amber-deep)}
.cell.taken .cn{color:var(--ink)}

.tick.red.on{border-color:var(--red);background:#2a0f0a;color:#ff8f7d}
.tick.red.on .box{border-color:var(--red);color:var(--red)}
.thumbrow{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.thumb{width:70px;height:70px;border-radius:11px;object-fit:cover;
  border:1px solid var(--line);background:var(--raised);flex:none}
.thumb.big{width:100%;height:auto;aspect-ratio:4/3;margin-bottom:14px}
.row.redtag::before{background:var(--red)!important}
.row.redtag{border-color:#5a1a12}

/* ---------- tally across the top of the sheet ---------- */
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:4px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 10px;position:relative;overflow:hidden}
.count .n{font-family:ui-monospace,Menlo,monospace;font-size:27px;font-weight:700;line-height:1}
.count .l{font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin-top:5px}
.count::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.count.c-loaded::before{background:var(--green)}
.count.c-roll::before{background:var(--blue)}
.count.c-waste::before{background:var(--red)}
.count.c-empty::before{background:var(--faint)}
.count.c-red::before{background:var(--red)}
.count.c-red .n{color:#ff8f7d}
.count.c-total::before{background:var(--amber)}
.count.c-total .n{color:var(--amber)}

/* ---------- carrying a trailer ---------- */
.moving{background:#1d1707;border:1px solid var(--amber-deep);border-radius:16px;
  padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.moving .cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:800}
.moving .num{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:700;line-height:1.1;margin-top:2px}
.moving .from{font-size:12.5px;color:#e8c98a;margin-top:3px}
.moving .far{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--amber);margin-top:8px}
.moving .drop{margin-top:12px}
.pulse{position:absolute;right:14px;top:14px;width:10px;height:10px;border-radius:50%;
  background:var(--amber);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>

<header>
  <b>Yard&nbsp;Check</b>
  <button class="gpschip" id="gps" data-act="gps">Finding you…</button>
  <button class="icon" data-act="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z"/>
    </svg>
  </button>
</header>

<main id="view"></main>
<nav id="nav"></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ============================================================
   Yard Check

   The lot has no painted numbers, so nothing asks you to pick a
   spot. You walk the line, key the number off the nose, and the
   row lands on the sheet in the order you walked it — same as
   the paper form's line numbers. GPS quietly records where each
   one stood and learns the rows over time.

   Sheet columns, matching the printed form:
     Trailer # | Customer / Delivery Location | Order # |
     Due Date  | Comments | Less than 1/2 full | Returns
   ============================================================ */

const KEY = "yardcheck-v2";
const ROW_M = 30;    /* readings this close get grouped into one row of the lot */

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const val = n => (document.querySelector(`[name="${n}"]`)?.value ?? "").trim();
const today = () => new Date().toISOString().slice(0,10);
const clock = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const shortDate = d => d ? new Date(d+"T12:00:00").toLocaleDateString([], {month:"numeric",day:"numeric"}) : "";
function dayLabel(d){
  if (d === today()) return "Today";
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if (d === y) return "Yesterday";
  return new Date(d+"T12:00:00").toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
}
const daysOut = due => due ? Math.round((new Date(due+"T12:00:00") - new Date(today()+"T12:00:00"))/864e5) : null;

const KINDS = [
  { id:"loaded", label:"Loaded",     load:true,  cls:"k-loaded" },
  { id:"empty",  label:"Empty",      load:false, cls:"k-empty"  },
  { id:"roll",   label:"Roll stock", load:false, cls:"k-roll"   },
  { id:"waste",  label:"Waste",      load:false, cls:"k-waste"  },
];
const kindOf = id => KINDS.find(k => k.id === id) || KINDS[0];

/* red tag reasons — the same list that was already in use */
const RED_REASONS = ["Crush","Print","Wrong grade","Water","Glue skip","Other"];

const PAPER = [
  { id:"got",    label:"Got it",     note:"read the tag"    },
  { id:"sealed", label:"Sealed",     note:"seal number"     },
  { id:"noread", label:"Can't read", note:"log and move on" },
];
const paperOf = id => PAPER.find(p => p.id === id) || PAPER[0];

/* ---------- state ---------- */
let S, TAB = "walk", persists = true, mem = null;
let POS = null, watchId = 0;
let UI = { digits:"", kind:"loaded", paper:"got", place:"lot", door:"",
           dest:"", order:"", due:"", seal:"", comments:"",
           half:false, returns:false, red:false, redWhy:"", photo:null,
           cam:false, q:"" };

function blank(){
  return { plant:"", shift:"Night shift", doorFrom:1, doorTo:12, entries:[], rows:[], move:null };
}
function doorList(){
  const out = [];
  for (let d = S.doorFrom; d <= S.doorTo; d++) out.push(d);
  return out;
}
const doorEntry = d => onDay(today()).filter(e => e.door === d).slice(-1)[0];
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ persists = false; mem = JSON.stringify(S); }
}
function load(){
  let raw;
  try { raw = localStorage.getItem(KEY); localStorage.setItem(KEY+":p","1"); localStorage.removeItem(KEY+":p"); }
  catch(e){ persists = false; raw = mem; }
  if (!raw){ S = blank(); return; }
  try {
    S = { ...blank(), ...JSON.parse(raw) };
    if (!Array.isArray(S.entries)) S.entries = [];
    if (!Array.isArray(S.rows))    S.rows = [];
    if (S.doorCount && !S.doorTo){ S.doorFrom = 1; S.doorTo = S.doorCount; }
    delete S.doorCount;
  } catch(e){ S = blank(); }
}
function toast(msg){
  const old = $(".toast"); if (old) old.remove();
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1700);
}

/* ============================================================
   GPS — records where each trailer stood, learns the rows
   ============================================================ */
function metres(a,b){
  const R = 6371000, rad = Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let GPSMSG = "Finding you…";
const FIX_GOOD_MS = 120000;   /* a fix stays usable for two minutes */

function startGPS(){
  if (!window.isSecureContext){
    paintGPS(null, "Needs https for GPS — tap");
    return;
  }
  if (!navigator.geolocation){ paintGPS(null,"No GPS here"); return; }
  paintGPS(null, "Finding you…");
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    p => { POS = { lat:p.coords.latitude, lng:p.coords.longitude,
                   acc:Math.round(p.coords.accuracy), at:Date.now() };
           paintGPS(POS);
           const changed = trackMove();
           if (TAB === "map" || S.move || changed) render(); },
    e => {
      /* a dropout shouldn't throw away a fix we just got — the yard
         is full of steel and the signal comes and goes */
      GPSMSG = e.code === 1 ? "Location blocked — tap" :
               e.code === 2 ? "Signal lost — tap to retry" :
                              "Still looking — tap to retry";
      if (e.code === 1) POS = null;
      paintGPS(POS);
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:30000 });
}

/* While you're carrying a trailer the app follows along, and once
   you've gone somewhere and sat still it asks if that's the spot. */
let TRAIL = [];
function trackMove(){
  if (!S.move || !POS) return false;
  TRAIL.push({ lat:POS.lat, lng:POS.lng, at:POS.at });
  if (TRAIL.length > 40) TRAIL.shift();

  const was = S.move.settled;
  const from = S.move.startPos;
  const gone = from ? metres(POS, from) : 0;
  S.move.moved = Math.round(gone);

  /* stood still for a while, and well away from where you picked it up */
  const recent = TRAIL.filter(t => t.at >= POS.at - 60000);
  const stopped = recent.length >= 2 &&
                  recent[0].at <= POS.at - 30000 &&
                  recent.every(t => metres(t, POS) <= 12);
  S.move.settled = !!(stopped && gone >= 20);
  if (S.move.settled && !was && navigator.vibrate) navigator.vibrate([40,80,40]);
  return S.move.settled !== was;
}

/* start a move from the keypad — the number is already in your thumb */
/* an empty space in the line — worth recording so you know where there's room */
function commitOpen(){
  let door = null, rowId = null;
  if (UI.place === "door"){
    door = Number(UI.door) || null;
    if (!door) return toast("Which door?");
  } else if (fixUsable() && POS.acc <= 30){
    rowId = learnRow(POS).id;
  }
  S.entries.push({
    id:uid(), date:today(), at:Date.now(),
    number:"", open:true, kind:null, paper:null,
    door, rowId,
    destination:"", order:"", due:"", seal:"", comments:"",
    half:false, returns:false, red:false, redWhy:"", photo:null,
    gps: POS ? { lat:POS.lat, lng:POS.lng, acc:POS.acc } : null,
  });
  save();
  if (navigator.vibrate) navigator.vibrate(25);
  resetRow(); render(); window.scrollTo(0,0);
  toast(door ? "Door " + door + " empty" : "Open space logged");
}

function beginMoveNumber(){
  const n = UI.digits.trim();
  if (!n) return toast("Trailer number first");
  let e = onDay(today()).find(x => x.number === n);
  if (!e){
    /* not walked yet — put it on the sheet first so the move has a row to update */
    commit();
    e = onDay(today()).find(x => x.number === n);
    if (!e) return;           /* commit refused it; the toast already said why */
  }
  beginMove(e.id);
}

function beginMove(entryId){
  const e = S.entries.find(x => x.id === entryId); if (!e) return;
  TRAIL = [];
  S.move = {
    entryId: e.id, number: e.number,
    fromText: placeText(e), fromDoor: e.door || null,
    startedAt: Date.now(),
    startPos: POS ? { lat:POS.lat, lng:POS.lng } : null,
    moved: 0, settled: false,
  };
  save(); closeSheet(); TAB = "walk"; render(); window.scrollTo(0,0);
  toast("Following " + e.number);
}

function dropMove(door){
  const m = S.move; if (!m) return;
  const e = S.entries.find(x => x.id === m.entryId);
  if (!e){ S.move = null; save(); render(); return; }

  const wasAt = m.fromText;
  if (door){ e.door = Number(door); e.rowId = null; }
  else {
    e.door = null;
    e.rowId = POS ? learnRow(POS).id : e.rowId;
  }
  if (POS) e.gps = { lat:POS.lat, lng:POS.lng, acc:POS.acc };
  e.at = Date.now();
  const note = "moved from " + wasAt.toLowerCase();
  e.comments = e.comments ? e.comments + "; " + note : note;

  S.move = null; TRAIL = [];
  save(); render(); window.scrollTo(0,0);
  toast(e.number + " parked at " + placeText(e).toLowerCase());
}
function cancelMove(){
  S.move = null; TRAIL = []; save(); render(); toast("Move called off");
}
function paintGPS(pos,msg){
  if (msg) GPSMSG = msg;
  const el = $("#gps"); if (!el) return;
  el.className = "gpschip";
  if (!pos){ el.textContent = GPSMSG; el.classList.add("bad"); return; }
  const age = Date.now() - (pos.at || 0);
  if (age > FIX_GOOD_MS){
    el.textContent = "±" + pos.acc + " m · " + Math.round(age/60000) + "m old";
    el.classList.add("bad"); return;
  }
  el.textContent = "±" + pos.acc + " m" + (age > 20000 ? " ·" + Math.round(age/1000) + "s" : "");
  el.classList.add(pos.acc <= 10 ? "good" : pos.acc <= 25 ? "ok" : "bad");
}
/* a fix older than two minutes shouldn't be used to place a trailer */
const fixUsable = () => !!POS && (Date.now() - POS.at) <= FIX_GOOD_MS;
const rowById = id => S.rows.find(r => r.id === id);
function nearestRow(pos, radius){
  let best = null, bd = Infinity;
  for (const r of S.rows){ const d = metres(pos, r); if (d < bd){ bd = d; best = r; } }
  return (best && bd <= (radius ?? ROW_M)) ? { row:best, dist:Math.round(bd) } : null;
}
function learnRow(pos){
  const near = nearestRow(pos);
  if (near){
    const r = near.row;
    r.n = (r.n||1) + 1;
    r.lat += (pos.lat - r.lat)/r.n;
    r.lng += (pos.lng - r.lng)/r.n;
    return r;
  }
  const r = { id:uid(), lat:pos.lat, lng:pos.lng, n:1,
              label:"Row " + String.fromCharCode(65 + S.rows.length % 26) };
  S.rows.push(r);
  return r;
}
function placeText(e){
  if (e.door) return "Door " + e.door;
  const r = e.rowId ? rowById(e.rowId) : null;
  return r ? r.label : "Lot";
}

/* ============================================================
   entries
   ============================================================ */
const onDay = d => S.entries.filter(e => e.date === d);
const lineNo = e => onDay(e.date).findIndex(x => x.id === e.id) + 1;
function prevWalkDay(){
  const days = [...new Set(S.entries.map(e => e.date))].filter(d => d < today()).sort();
  return days.length ? days[days.length-1] : null;
}
function lastSeen(number){
  const rows = S.entries.filter(e => e.number === number && e.date < today());
  return rows.length ? rows[rows.length-1] : null;
}
function reconcile(){
  const prev = prevWalkDay();
  const now = new Map(onDay(today()).filter(e => e.number && !e.open).map(e => [e.number, e]));
  const then = new Map(prev ? onDay(prev).filter(e => e.number && !e.open).map(e => [e.number, e]) : []);
  const arrived = [], gone = [], moved = [];
  for (const [n,e] of now){
    if (!then.has(n)) arrived.push(e);
    else {
      const was = then.get(n);
      if (was.door !== e.door || (was.rowId||null) !== (e.rowId||null)) moved.push({ e, was });
    }
  }
  for (const [n,e] of then) if (!now.has(n)) gone.push(e);
  return { prev, arrived, gone, moved, todayCount:now.size, prevCount:then.size };
}
/* here last walk, not yet accounted for on this one */
function stillToCheck(){
  const prev = prevWalkDay(); if (!prev) return [];
  const now = new Set(onDay(today()).filter(e => e.number).map(e => e.number));
  return onDay(prev).filter(e => e.number && !e.open && !now.has(e.number));
}

function resetRow(){
  UI.digits = ""; UI.seal = ""; UI.comments = "";
  UI.half = false; UI.returns = false; UI.paper = "got";
  UI.red = false; UI.redWhy = ""; UI.photo = null;
  /* customer, order and due carry — a run of loads usually shares them */
}

function commit(){
  const number = UI.digits.trim();
  if (!number) return toast("Trailer number first");
  const k = kindOf(UI.kind);
  if (k.load && UI.paper === "sealed" && !UI.seal.trim())
    return toast("Seal number, or mark it can't read");

  const dupe = onDay(today()).find(e => e.number === number);
  if (dupe && !confirm(number + " is already on today's sheet. Add it again?")) return;

  let door = null, rowId = null;
  if (UI.place === "door"){
    door = Number(UI.door) || null;
    if (!door) return toast("Which door?");
  } else if (fixUsable() && POS.acc <= 30){
    rowId = learnRow(POS).id;
  }

  const gotPaper = k.load && UI.paper === "got";
  S.entries.push({
    id:uid(), date:today(), at:Date.now(),
    number, kind:UI.kind, paper: k.load ? UI.paper : null,
    door, rowId,
    destination: gotPaper ? UI.dest : "",
    order:       gotPaper ? UI.order : "",
    due:         gotPaper ? UI.due : "",
    seal:        (k.load && UI.paper === "sealed") ? UI.seal : "",
    comments: UI.comments,
    half: !!UI.half, returns: !!UI.returns,
    red: !!UI.red, redWhy: UI.red ? UI.redWhy : "",
    photo: UI.photo || null,
    gps: POS ? { lat:POS.lat, lng:POS.lng, acc:POS.acc } : null,
  });
  try { save(); }
  catch(err){ toast("Storage full — back up and clear"); }
  if (navigator.vibrate) navigator.vibrate(50);
  resetRow(); render(); window.scrollTo(0,0);
  toast(number + " on the sheet");
}

function recentVals(field, n){
  const seen = new Set();
  for (let i = S.entries.length-1; i >= 0 && seen.size < (n||5); i--){
    const v = (S.entries[i][field] || "").trim();
    if (v) seen.add(v);
  }
  return [...seen];
}

/* ---------- photo of the trailer or the load ---------- */
function shrink(img, w, h, max){
  const cap = max || 320, scale = Math.min(1, cap / Math.max(w,h));
  const c = document.createElement("canvas");
  c.width = Math.round(w*scale); c.height = Math.round(h*scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", max ? 0.8 : 0.45);
}
function readPhoto(file, max){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => res({ small: shrink(img, img.width, img.height),
                               big:   max ? shrink(img, img.width, img.height, max) : null });
      img.onerror = () => res(null);
      img.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(file);
  });
}

/* ---------- reading the tag with the camera ----------
   Tesseract is ~4 MB and only fetched the first time you use it,
   then the browser caches it. Barcode stays the first choice;
   this is for tags that won't scan. Nothing it reads is trusted
   without you looking at it first. */
const OCR = { loading:false, ready:false, busy:false };

function loadOCR(){
  if (OCR.ready) return Promise.resolve(true);
  if (OCR.loading) return OCR.loading;
  OCR.loading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://unpkg.com/tesseract.js@7.0.0/dist/tesseract.min.js";
    s.onload = () => { OCR.ready = true; res(true); };
    s.onerror = () => { OCR.loading = null; rej(new Error("download failed")); };
    document.head.appendChild(s);
  });
  return OCR.loading;
}

/* Big print survives a shot taken at an angle; 6pt captions don't.
   Upscaling and hardening contrast before OCR buys back the captions,
   which is what makes the date labels readable at all. */
function prepForOCR(dataUrl){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(3, Math.max(2, 1800 / Math.max(img.width, img.height)));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const x = c.getContext("2d");
      x.imageSmoothingQuality = "high";
      x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
      /* grey, then stretch contrast around the page mean */
      let sum = 0;
      for (let i = 0; i < p.length; i += 4){
        const g = (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114);
        p[i] = p[i+1] = p[i+2] = g; sum += g;
      }
      const mean = sum / (p.length/4);
      for (let i = 0; i < p.length; i += 4){
        const v = Math.max(0, Math.min(255, (p[i] - mean) * 1.7 + 140));
        p[i] = p[i+1] = p[i+2] = v;
      }
      x.putImageData(d, 0, 0);
      res(c.toDataURL("image/jpeg", 0.92));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

const DATE_RE = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/;
function isoOf(s){
  const m = String(s).match(DATE_RE); if (!m) return "";
  const yr = m[3].length === 2 ? "20"+m[3] : m[3];
  return `${yr}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
}
const midX = w => (w.bbox.x0 + w.bbox.x1)/2;
const midY = w => (w.bbox.y0 + w.bbox.y1)/2;

/* DUE DATE and MFG DATE sit side by side in tiny type above two
   identical-looking dates. Match each date to whichever caption is
   nearest above or beside it, rather than to whichever came first. */
function datesByPosition(words){
  const caps = words.filter(w => /^(DUE|MFG|MFD|SHIP)$/i.test(w.text.replace(/[^A-Z]/gi,"")));
  const dates = words.filter(w => DATE_RE.test(w.text.trim()));
  const out = { due:"", mfg:"" };
  if (!dates.length) return out;

  for (const d of dates){
    let best = null, bd = Infinity;
    for (const c of caps){
      const dx = Math.abs(midX(c) - midX(d));
      const dy = midY(d) - midY(c);            /* caption should sit above */
      if (dy < -10) continue;                   /* caption below the value */
      const dist = dx + dy*0.6;
      if (dist < bd){ bd = dist; best = c; }
    }
    if (!best || bd > (d.bbox.x1 - d.bbox.x0) * 4) continue;
    const tag = best.text.toUpperCase();
    if (tag.startsWith("DUE") && !out.due) out.due = isoOf(d.text.trim());
    if ((tag.startsWith("MFG") || tag.startsWith("MFD")) && !out.mfg) out.mfg = isoOf(d.text.trim());
  }
  return out;
}

/* pull the fields off a printed tag */
function parseTag(raw, words){
  const text = String(raw || "").replace(/\r/g, "");
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const out = { order:"", due:"", dest:"", raw:text, notes:[] };

  /* order / lot — labelled first, otherwise a lone 9-digit run.
     It's the most reliable thing on the tag: big, bold, and printed
     twice, as text and again under the barcode. */
  const labelled = text.match(/(?:ORDER|LOT)[^\n0-9]{0,20}(\d{6,12})/i);
  if (labelled) out.order = labelled[1];
  else {
    const nines = (text.match(/\b\d{9}\b/g) || []).filter(n => !/^0{4}/.test(n));
    if (nines.length) out.order = nines[0];
  }

  /* dates — position first, caption text as the fallback */
  let due = "", mfg = "";
  if (words && words.length){
    const p = datesByPosition(words);
    due = p.due; mfg = p.mfg;
  }
  if (!due){
    const m = text.match(/DUE\s*DATE?[\s\S]{0,40}?(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
    if (m) due = isoOf(m[1]);
  }
  if (!mfg){
    const m = text.match(/(?:MFG|MFD)\s*DATE?[\s\S]{0,40}?(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
    if (m) mfg = isoOf(m[1]);
  }
  /* a due date before the manufacture date means the two got swapped
     or a digit was misread — 6 and 8 are the usual pair */
  if (due && mfg && due < mfg){
    out.notes.push("Due date read as earlier than the manufacture date — check it.");
    due = "";
  }
  const allDates = (text.match(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/g) || []);
  if (!due && allDates.length > 1)
    out.notes.push("Two dates on the tag and the captions didn't read — due date left blank.");
  out.due = due;

  /* destination — CITY, ST at the end of a ship-to line. Two guards:
     the state has to be a real one, and the comma is optional, because
     OCR loses commas more often than it loses anything else. */
  const STATES = new Set(("AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI "+
    "MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC PR").split(" "));
  const LEADS = ["BATON","SAN","LOS","LAS","NEW","FORT","ST","SAINT","SANTA",
                 "LAKE","WEST","EAST","NORTH","SOUTH","PORT","MOUNT","BAY","GRAND"];
  const cityFrom = (chunk, st) => {
    const ws = chunk.trim().split(/\s+/).filter(w => /^[A-Z][A-Z.'-]{1,}$/.test(w));
    if (!ws.length) return "";
    let city = ws[ws.length-1];
    const before = ws[ws.length-2];
    if (before && LEADS.includes(before)) city = before + " " + city;
    return city.split(" ").map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(" ") + " " + st;
  };
  for (const l of lines){
    const up = l.toUpperCase();
    let m = up.match(/([A-Z][A-Z .'-]{2,40}),\s*([A-Z]{2})\b/);   /* comma present */
    if (m && STATES.has(m[2])){ out.dest = cityFrom(m[1], m[2]); break; }
    m = up.match(/\b([A-Z][A-Z.'-]{2,20})\s+([A-Z]{2})\s*$/);      /* comma lost */
    if (m && STATES.has(m[2])){
      const idx = up.lastIndexOf(m[1]);
      out.dest = cityFrom(up.slice(0, idx + m[1].length), m[2]);
      break;
    }
  }
  if (!out.dest){
    const shortTag = !/SHIP\s*TO|CUSTOMER\s*$|BILL\s*TO/im.test(text) &&
                     /CUSTOMER\s*PART/i.test(text);
    out.shortTag = shortTag;
    out.notes.push(shortTag
      ? "This looks like the short tag — it doesn't print a delivery location."
      : "No city and state found on the tag.");
  }
  return out;
}

async function readTag(dataUrl){
  OCR.busy = true;
  try {
    await loadOCR();
  } catch(e){
    OCR.busy = false;
    return openSheet(`<h2>Couldn't download the reader</h2>
      <div class="sub">It needs signal the first time only.</div>
      <div class="hint">Once it's downloaded on wifi it works in the yard without a connection. Until then, use the barcode or type it.</div>
      <div class="btnrow"><button class="btn ghost" data-act="close">Close</button></div>`);
  }
  openSheet(`<h2>Reading the tag…</h2><div class="sub">A few seconds.</div>
    <img class="thumb big" src="${dataUrl}" alt="">`);
  let text = "", words = [];
  try {
    const prepped = await prepForOCR(dataUrl);
    const r = await Tesseract.recognize(prepped, "eng");
    text  = r?.data?.text || "";
    words = r?.data?.words || [];
  } catch(e){ text = ""; }
  OCR.busy = false;
  const f = parseTag(text, words);
  UI.ocr = f;
  showTagResult(dataUrl, f);
}

function showTagResult(dataUrl, f){
  const got = f.order || f.due || f.dest;
  let h = `<h2>${got ? "Here's what it read" : "Couldn't read it"}</h2>
    <div class="sub">${got ? "Check each one against the tag before you use it." : "Try again square on with more light, or type it."}</div>
    <img class="thumb big" src="${dataUrl}" alt="">`;
  for (const n of (f.notes || []))
    h += `<div class="warn">${esc(n)}</div>`;
  if (got){
    h += `<div class="card">`;
    const field = (lbl, val, key, absent) => val
      ? `<div class="row"><span class="body"><span class="t">${esc(val)}</span>
         <span class="s">${lbl}</span></span>
         <button class="btn ghost sm" style="width:auto;padding:0 14px" data-act="use-ocr" data-k="${key}">Use</button></div>`
      : `<div class="row"><span class="body"><span class="t" style="color:var(--faint);font-weight:500">${absent || "nothing found"}</span>
         <span class="s">${lbl}</span></span></div>`;
    h += field("Order #", f.order, "order");
    h += field("Customer / delivery", f.dest, "dest",
               f.shortTag ? "not on this tag" : null);
    h += field("Due date", f.due ? shortDate(f.due) : "", "due");
    h += `<div class="btnrow"><button class="btn" data-act="use-ocr" data-k="all">Use everything it found</button></div>`;
    h += `</div>`;
  }
  h += `<div class="btnrow"><button class="btn ghost sm" data-act="ocr-raw">See the raw text</button>
    <button class="btn ghost sm" data-act="close">Close</button></div>`;
  openSheet(h);
}

/* ---------- order barcode ---------- */
const CAM = { stream:null, det:null, raf:0, on:false };
const canScan = () => typeof window.BarcodeDetector !== "undefined";
async function openCam(){
  if (!canScan()){ toast("No barcode reader in this browser"); return; }
  UI.cam = true; render();
  try {
    CAM.det = new BarcodeDetector({ formats:[
      "code_128","code_39","code_93","itf","ean_13","upc_a","qr_code","data_matrix","pdf417","codabar"]});
    CAM.stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1280} }, audio:false });
    const v = $("#cam"); if (!v){ closeCam(); return; }
    v.srcObject = CAM.stream; await v.play(); CAM.on = true;
    const n = $("#camnote"); if (n) n.textContent = "Point at the order barcode";
    camLoop();
  } catch(e){ toast("Camera blocked"); closeCam(); render(); }
}
async function camLoop(){
  if (!CAM.on) return;
  const v = $("#cam");
  if (!v || v.readyState < 2){ CAM.raf = requestAnimationFrame(camLoop); return; }
  try {
    const hits = await CAM.det.detect(v);
    if (hits && hits.length && hits[0].rawValue){
      const raw = String(hits[0].rawValue).trim();
      if (navigator.vibrate) navigator.vibrate(50);
      UI.order = raw.slice(0,24);
      closeCam(); render(); toast("Order " + UI.order);
      return;
    }
  } catch(e){}
  CAM.raf = requestAnimationFrame(camLoop);
}
function closeCam(){
  CAM.on = false; UI.cam = false;
  if (CAM.raf) cancelAnimationFrame(CAM.raf);
  if (CAM.stream){ CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
}

/* ============================================================
   VIEWS
   ============================================================ */
function viewWalk(){
  const k = kindOf(UI.kind);
  const n = UI.digits;
  const nextLine = onDay(today()).length + 1;
  const dupe = n ? onDay(today()).find(e => e.number === n) : null;
  const was  = n && !dupe ? lastSeen(n) : null;
  const near = POS && UI.place === "lot" ? nearestRow(POS) : null;

  let h = "";
  if (!persists) h += `<div class="warn">Storage is blocked here, so nothing survives a reload. Save the file to your phone and open it from there.</div>`;
  h += moveBanner();

  h += `<div class="readout ${n?"ready":""}">
    <div class="line">Line ${nextLine}${near ? " · " + esc(near.row.label) + " · " + near.dist + " m" : ""}${
      POS && POS.acc > 30 ? " · weak GPS" : ""}</div>
    <div class="digits ${n?"":"ghost"}">${esc(n || "—————")}</div>
    <div class="meta">${esc(k.label)}${k.load ? " · " + esc(paperOf(UI.paper).label) : ""}${
      UI.place === "door" ? " · Door " + esc(UI.door || "?") : ""}</div>
    ${dupe ? `<div class="flag dupe">Already on today's sheet, line ${lineNo(dupe)}</div>`
      : was ? `<div class="flag warn">${esc(dayLabel(was.date))} it was at ${esc(placeText(was).toLowerCase())}</div>`
      : n.length >= 4 ? `<div class="flag new">New to the yard</div>` : ""}
  </div>`;

  h += `<div class="pad">`;
  for (const d of ["1","2","3","4","5","6","7","8","9"])
    h += `<button data-act="key" data-k="${d}">${d}</button>`;
  h += `<button class="fn" data-act="key" data-k="-">–</button>
        <button data-act="key" data-k="0">0</button>
        <button class="fn" data-act="key" data-k="del">Back</button></div>`;

  h += `<div class="btnrow" style="margin-top:0">
    <button class="btn" data-act="commit" ${n?"":"disabled"}>Add to the sheet</button></div>
    <div class="btnrow"><button class="btn ghost" data-act="move-number" ${n?"":"disabled"}>
      <svg viewBox="0 0 24 24"><path d="M1 7h13v10H1zM14 10h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      Moving this one — follow me</button></div>
    <div class="btnrow"><button class="btn ghost" data-act="open-spot">Nothing here — open space</button></div>`;

  h += `<div class="eyebrow">What's on it</div><div class="pick">`;
  for (const kk of KINDS)
    h += `<button data-act="kind" data-k="${kk.id}" class="${UI.kind===kk.id?"on":""}">${esc(kk.label)}</button>`;
  h += `</div>`;

  h += `<div class="eyebrow">Where it's sitting</div><div class="chips">`;
  h += `<button class="chip ${UI.place==="lot"?"on":""}" data-act="place" data-p="lot">
    In the lot${POS && UI.place==="lot" ? ` <span style="color:var(--faint)">GPS</span>` : ""}</button>`;
  for (const d of doorList()){
    const occ = doorEntry(d);
    const on = UI.place === "door" && String(UI.door) === String(d);
    h += `<button class="chip ${on?"on":""}" data-act="door" data-d="${d}">${d}${
      occ ? ` <span style="color:var(--faint)">${esc(occ.number)}</span>` : ""}</button>`;
  }
  h += `</div>`;

  /* once a spot has been logged once, walking back up to it should
     tell you what was there — that's the whole point of the GPS */
  if (UI.place === "lot" && POS){
    const near = nearestRow(POS);
    const prev = prevWalkDay();
    if (near && prev){
      const walkedToday = new Set(onDay(today()).map(e => e.number));
      const wereHere = onDay(prev).filter(e => e.rowId === near.row.id && !walkedToday.has(e.number));
      if (wereHere.length){
        h += `<div class="eyebrow">Last walk, right here</div>`;
        for (const e of wereHere.slice(0,4)){
          h += `<div class="row ${kindOf(e.kind).cls}">
            <span class="body"><span class="t">${esc(e.number)}</span>
            <span class="s">${esc(kindOf(e.kind).label)}${e.destination?" · "+esc(e.destination):""}${e.order?" · "+esc(e.order):""}</span></span>
            <button class="btn ghost sm" style="width:auto;padding:0 14px" data-act="carry" data-n="${esc(e.number)}">Same</button>
          </div>`;
        }
        h += `<div class="hint">Hasn't moved? Tap Same and it goes on today's sheet with everything it had last walk.</div>`;
      }
    }
  }

  if (k.load){
    h += `<div class="eyebrow">Paperwork</div><div class="pick three">`;
    for (const p of PAPER)
      h += `<button data-act="paper" data-p="${p.id}" class="${UI.paper===p.id?"on":""}">${esc(p.label)}<small>${esc(p.note)}</small></button>`;
    h += `</div>`;

    if (UI.paper === "got"){
      h += `<div class="card" style="margin-top:8px">`;
      if (UI.cam){
        h += `<div class="camwrap"><video id="cam" playsinline muted autoplay></video>
          <div class="reticle"></div><div class="camnote" id="camnote">Starting the camera…</div></div>
          <button class="btn ghost sm" data-act="stopcam">Stop</button>`;
      } else if (canScan()){
        h += `<div class="btnrow" style="margin:0 0 12px">
          <button class="btn ghost sm" data-act="scan">
            <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
            Scan barcode</button>
          <button class="btn ghost sm" data-act="read-tag">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
            Read the tag</button></div>`;
      } else {
        h += `<div class="btnrow" style="margin:0 0 12px">
          <button class="btn ghost sm" data-act="read-tag">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
            Read the tag with the camera</button></div>`;
      }
      h += `<label class="f"><span class="lb">Customer / delivery location</span>
        <input name="dest" placeholder="Moultrie GA" value="${esc(UI.dest)}" data-act="field" data-f="dest"></label>`;
      const rd = recentVals("destination");
      if (rd.length) h += `<div class="chips" style="margin:-4px 0 12px">` + rd.map(v =>
        `<button class="chip ${UI.dest===v?"on":""}" data-act="setf" data-f="dest" data-v="${esc(v)}">${esc(v)}</button>`).join("") + `</div>`;
      h += `<div class="grid2">
        <label class="f"><span class="lb">Order #</span>
          <input name="order" class="mono" inputmode="numeric" placeholder="607912101" value="${esc(UI.order)}" data-act="field" data-f="order"></label>
        <label class="f"><span class="lb">Due date</span>
          <input name="due" type="date" value="${esc(UI.due)}" data-act="field" data-f="due"></label>
      </div><div class="hint" style="margin-top:-4px">Customer, order and due date carry to the next one — change them when the load changes.</div></div>`;
    }
    if (UI.paper === "sealed"){
      h += `<div class="card" style="margin-top:8px">
        <label class="f" style="margin-bottom:0"><span class="lb">Seal number</span>
        <input name="seal" class="mono" inputmode="numeric" placeholder="Off the seal" value="${esc(UI.seal)}" data-act="field" data-f="seal"></label>
        <div class="hint">Sealed means the paperwork is out of reach, so the seal is the record.</div></div>`;
    }
    if (UI.paper === "noread")
      h += `<div class="hint" style="margin-top:10px">Logged as couldn't read — number and location only. Add it and keep walking.</div>`;
  }

  h += `<div class="eyebrow">Condition</div>`;
  h += `<button class="tick red ${UI.red?"on":""}" style="width:100%" data-act="tick" data-t="red">
    <span class="box">✓</span>Red tag this trailer</button>`;
  if (UI.red){
    h += `<div class="chips" style="margin-top:8px">`;
    for (const r of RED_REASONS)
      h += `<button class="chip ${UI.redWhy===r?"on":""}" data-act="setf" data-f="redWhy" data-v="${esc(r)}">${esc(r)}</button>`;
    h += `</div>`;
  }
  h += `<div class="ticks">
    <button class="tick ${UI.half?"on":""}" data-act="tick" data-t="half"><span class="box">✓</span>Less than ½ full</button>
    <button class="tick ${UI.returns?"on":""}" data-act="tick" data-t="returns"><span class="box">✓</span>Returns</button>
  </div>`;

  h += `<div class="eyebrow">Photo</div>
    <input type="file" accept="image/*" capture="environment" id="photoinput" hidden>`;
  if (UI.photo){
    h += `<div class="thumbrow"><img class="thumb" src="${UI.photo}" alt="">
      <div style="flex:1"><div style="font-size:13.5px;font-weight:700">Photo attached</div>
      <div style="font-size:12px;color:var(--faint)">Saves with this trailer.</div></div>
      <button class="btn ghost sm" style="width:auto;padding:0 14px" data-act="drop-photo">Remove</button></div>`;
  } else {
    h += `<button class="btn ghost sm" data-act="take-photo">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Take a photo</button>`;
  }

  h += `<div style="margin-top:12px"><label class="f" style="margin-bottom:0">
    <span class="lb">Comments</span>
    <textarea name="comments" placeholder="Flat tire, blocked in, doors frozen…" data-act="field" data-f="comments">${esc(UI.comments)}</textarea></label></div>`;

  const done = onDay(today()).slice(-4).reverse();
  if (done.length){
    h += `<div class="eyebrow">Last few</div>`;
    for (const e of done) h += rowFor(e);
  }
  return h;
}

function moveBanner(){
  const m = S.move; if (!m) return "";
  const near = POS ? nearestRow(POS) : null;
  let h = `<div class="moving"><div class="pulse"></div>
    <div class="cap">${m.settled ? "Looks parked" : "Carrying"}</div>
    <div class="num">${esc(m.number)}</div>
    <div class="from">Pulled from ${esc(m.fromText.toLowerCase())}</div>
    <div class="far">${POS ? (m.moved||0) + " m away" + (near ? " · near " + esc(near.row.label) : "") : "waiting on GPS"}</div>
    <div class="drop">`;
  h += `<button class="btn" data-act="drop">${m.settled ? "Yes — parked it here" : "Parked it here"}</button>`;
  h += `<div class="btnrow"><button class="btn ghost sm" data-act="drop-door">Backed it into a door</button>
        <button class="btn ghost sm" data-act="cancel-move">Never mind</button></div>`;
  h += `</div></div>`;
  return h;
}

function rowFor(e, extra){
  if (e.open){
    return `<button class="row open ${extra||""}" data-act="entry" data-id="${e.id}">
      <span class="ln">${lineNo(e)}</span>
      <span class="body"><span class="t" style="color:var(--faint);font-weight:500">open space</span>
      <span class="s">${esc(placeText(e))} · nothing parked</span></span>
      <span class="side">${clock(e.at)}</span></button>`;
  }
  const k = kindOf(e.kind);
  const bits = [];
  if (e.red) bits.push("RED TAG" + (e.redWhy ? " · " + e.redWhy : ""));
  bits.push(k.label, placeText(e));
  if (e.seal) bits.push("seal " + e.seal);
  else if (e.paper === "noread") bits.push("couldn't read");
  else {
    if (e.destination) bits.push(e.destination);
    if (e.order) bits.push(e.order);
  }
  if (e.half) bits.push("< ½");
  if (e.returns) bits.push("returns");
  if (e.photo) bits.push("photo");
  if (e.comments) bits.push(e.comments);
  const d = daysOut(e.due);
  return `<button class="row ${k.cls} ${e.red?"redtag":""} ${extra||""} ${e.due && d !== null && d <= 2 ? "due":""}" data-act="entry" data-id="${e.id}">
    <span class="ln">${lineNo(e)}</span>
    <span class="body"><span class="t">${esc(e.number)}</span>
    <span class="s">${esc(bits.join(" · "))}</span></span>
    <span class="side">${e.due ? esc(shortDate(e.due)) + "<br>" : ""}${clock(e.at)}</span></button>`;
}

function viewSheet(){
  const rows = onDay(today());
  const t = tallyOf(rows);
  let h = `<div class="counts">
    <div class="count c-loaded"><div class="n">${t.loaded}</div><div class="l">Loaded</div></div>
    <div class="count c-roll"><div class="n">${t.roll}</div><div class="l">Roll stock</div></div>
    <div class="count c-waste"><div class="n">${t.waste}</div><div class="l">Waste</div></div>
    <div class="count c-empty"><div class="n">${t.empty}</div><div class="l">Empty</div></div>
    <div class="count c-red"><div class="n">${t.red}</div><div class="l">Red tag</div></div>
    <div class="count c-total"><div class="n">${t.trailers}</div><div class="l">Trailers</div></div>
  </div>`;
  if (t.open) h += `<div class="hint" style="margin:8px 0 0">${t.open} open space${t.open>1?"s":""} logged.</div>`;
  if (!rows.length){
    h += `<div class="empty"><b>Sheet is blank</b>Walk the line and rows land here in the order you took them.</div>`;
    return h;
  }
  h += `<div class="eyebrow">Today, in walk order</div>`;
  for (const e of rows) h += rowFor(e);
  h += `<div class="btnrow"><button class="btn" data-act="preview">See the sheet</button></div>
    <div class="btnrow"><button class="btn ghost sm" data-act="csv">Save spreadsheet</button>
    <button class="btn ghost sm" data-act="txt">Save sheet</button></div>`;
  return h;
}

function viewCheck(){
  const r = reconcile();
  const todo = stillToCheck();
  let h = `<div style="display:flex;gap:8px">
    <div class="stat"><div class="n">${r.todayCount}</div><div class="l">Walked</div></div>
    <div class="stat"><div class="n" style="color:var(--green)">${r.arrived.length}</div><div class="l">New in</div></div>
    <div class="stat"><div class="n" style="color:var(--faint)">${r.gone.length}</div><div class="l">Gone</div></div>
  </div>`;

  const redToday = onDay(today()).filter(e => e.red);
  if (redToday.length){
    h += `<div class="eyebrow">Red tagged · ${redToday.length}</div>`;
    for (const e of redToday) h += rowFor(e);
  }

  const dueSoon = onDay(today()).filter(e => e.due && daysOut(e.due) <= 3)
    .sort((a,b) => a.due.localeCompare(b.due));
  if (dueSoon.length){
    h += `<div class="eyebrow">Due in the next few days</div>`;
    for (const e of dueSoon){
      const d = daysOut(e.due);
      h += `<button class="row k-loaded due" data-act="entry" data-id="${e.id}">
        <span class="ln">${lineNo(e)}</span>
        <span class="body"><span class="t">${esc(e.number)}</span>
        <span class="s">${esc(e.destination || "no customer")} · ${esc(placeText(e))}</span></span>
        <span class="side" style="color:${d<0?"var(--red)":"var(--amber)"}">${d<0?"late":d===0?"today":d+"d"}<br>${esc(shortDate(e.due))}</span></button>`;
    }
  }

  if (!r.prev){
    h += `<div class="hint" style="margin-top:16px">Walk the yard twice and this screen starts showing what came in, what left, what moved, and which trailers you haven't accounted for yet.</div>`;
    return h;
  }

  h += `<div class="eyebrow">Not accounted for yet · ${todo.length}</div>`;
  if (!todo.length){
    h += `<div class="empty"><b>Yard is covered</b>Everything from ${dayLabel(r.prev).toLowerCase()} has been walked or marked gone.</div>`;
  } else {
    h += `<div class="hint" style="margin:-4px 0 10px">These were here ${dayLabel(r.prev).toLowerCase()}. If one hasn't moved, carry it over instead of walking it again.</div>`;
    for (const e of todo){
      h += `<div class="row ${kindOf(e.kind).cls}">
        <span class="body"><span class="t">${esc(e.number)}</span>
        <span class="s">was ${esc(placeText(e).toLowerCase())} · ${esc(kindOf(e.kind).label)}${e.destination?" · "+esc(e.destination):""}</span></span>
        <button class="btn ghost sm" style="width:auto;padding:0 12px" data-act="carry" data-n="${esc(e.number)}">Same</button>
      </div>`;
    }
    h += `<div class="btnrow"><button class="btn ghost sm" data-act="carry-all">All ${todo.length} unchanged</button></div>`;
  }

  if (r.moved.length){
    h += `<div class="eyebrow">Moved since ${esc(dayLabel(r.prev).toLowerCase())}</div>`;
    for (const m of r.moved)
      h += `<button class="row" data-act="entry" data-id="${m.e.id}">
        <span class="body"><span class="t">${esc(m.e.number)}</span>
        <span class="s">${esc(placeText(m.was))} → ${esc(placeText(m.e))}</span></span>
        <span class="side">${clock(m.e.at)}</span></button>`;
  }
  if (r.arrived.length){
    h += `<div class="eyebrow">New in</div>`;
    for (const e of r.arrived) h += rowFor(e);
  }
  if (r.gone.length){
    h += `<div class="eyebrow">Gone since ${esc(dayLabel(r.prev).toLowerCase())}</div>`;
    for (const e of r.gone) h += rowFor(e, "gone");
  }
  return h;
}

function viewMap(){
  let h = "";
  const doors = doorList();
  if (doors.length){
    const taken = doors.filter(d => doorEntry(d)).length;
    h += `<div class="eyebrow">Doors · ${taken} of ${doors.length} filled</div><div class="grid">`;
    for (const d of doors){
      const e = doorEntry(d);
      h += `<button class="cell ${e?"taken":""}" ${e?`data-act="entry" data-id="${e.id}"`:""}>
        <span class="cn">${d}</span>
        ${e ? `<span class="ct">${esc(e.number.slice(-5))}</span>` : ""}</button>`;
    }
    h += `</div>`;
  }

  h += `<div class="eyebrow">The lot</div>
    <div class="hint" style="margin-bottom:12px">Nothing's numbered out there, so the app makes its own rows: every trailer you log drops a point, and points within ${ROW_M} metres group together. Rename a row to whatever you call it — back fence, by the shop, north line.</div>`;
  if (!S.rows.length){
    h += `<div class="empty"><b>No rows learned yet</b>Log a few trailers in the lot with GPS on and they'll group up here.</div>`;
    return h;
  }
  const t = today();
  const sorted = S.rows.slice().sort((a,b) =>
    POS ? metres(POS,a) - metres(POS,b) : (b.n||1) - (a.n||1));
  h += `<div class="eyebrow">${POS ? "Closest first" : "Most used first"} · ${S.rows.length} rows</div>`;

    const here = onDay(t).filter(e => e.rowId === r.id);

      <span class="body"><span class="t">${esc(r.label)}</span>
      <span class="s">${here.length ? here.map(e => e.number).join(", ") : "nothing logged today"} · ${r.n||1} reading${(r.n||1)>1?"s":""}</span></span>
      <span class="side">${d !== null ? d + " m" : ""}</span></button>`;
  }
  return h;

function viewLog(){
  const q = (UI.q||"").toLowerCase();
  let list = S.entries.slice().sort((a,b) => b.at - a.at);
  if (q) list = list.filter(e =>
    (e.number+" "+e.destination+" "+e.order+" "+e.seal+" "+e.comments+" "+e.date).toLowerCase().includes(q));
  let h = `<label class="f"><input name="q" placeholder="Search trailer, customer, order" value="${esc(UI.q||"")}" data-act="search"></label>`;
  if (!list.length){
    h += `<div class="empty"><b>${S.entries.length?"Nothing matches":"Nothing walked yet"}</b>${S.entries.length?"Clear the search.":"Start on the Walk tab."}</div>`;
    return h;
  }
  let day = null;
  for (const e of list){
    if (e.date !== day){
      day = e.date;
      h += `<div class="eyebrow">${esc(dayLabel(day))} · ${onDay(day).length} trailers</div>`;
    }
    h += rowFor(e);
  }
  return h;
}

/* ---------- output: the paper form's columns ---------- */
function commentCell(e){
  const bits = [];
  if (e.red) bits.push("RED TAG" + (e.redWhy ? " (" + e.redWhy + ")" : ""));
  if (e.kind && e.kind !== "loaded") bits.push(kindOf(e.kind).label);
  if (e.seal) bits.push("SEALED " + e.seal);
  if (e.paper === "noread") bits.push("paperwork unreadable");
  if (e.carried) bits.push("unchanged from last walk");
  if (e.photo) bits.push("photo on file");
  if (e.comments) bits.push(e.comments);
  return bits.join("; ");
}
function csv(){
  const q = s => `"${String(s ?? "").replace(/"/g,'""')}"`;
  const L = ["Line,Trailer #,Customer / Delivery Location,Order #,Due Date,Comments,Red Tag,Less Than 1/2 Full,Returns,Where,Date,Time,Lat,Lng"];
  for (const e of S.entries.slice().sort((a,b) => a.at-b.at))
    L.push([lineNo(e), e.number, e.destination, e.order, e.due, commentCell(e),
      e.red ? (e.redWhy || "X") : "",
      e.half?"X":"", e.returns?"X":"", placeText(e), e.date, clock(e.at),
      e.gps?e.gps.lat.toFixed(6):"", e.gps?e.gps.lng.toFixed(6):""].map(q).join(","));
  return L.join("\n");
}
function tallyOf(rows){
  const t = { loaded:0, roll:0, waste:0, empty:0, red:0, open:0, trailers:0 };
  for (const e of rows){
    if (e.open){ t.open++; continue; }
    t.trailers++;
    if (t[e.kind] !== undefined) t[e.kind]++;
    if (e.red) t.red++;
  }
  return t;
}
function sheetText(){
  const rows = onDay(today());
  const t = tallyOf(rows);
  const pad = (s,n) => String(s ?? "").slice(0,n).padEnd(n);
  const L = [];
  L.push(`YARD CHECK   ${S.plant || ""}   ${S.shift}`);
  L.push(new Date().toLocaleString());
  L.push("");
  L.push("=".repeat(96));
  L.push(`  LOADED ${String(t.loaded).padStart(3)}     ROLL STOCK ${String(t.roll).padStart(3)}     WASTE ${String(t.waste).padStart(3)}     EMPTY ${String(t.empty).padStart(3)}     RED TAG ${String(t.red).padStart(3)}     TRAILERS ${String(t.trailers).padStart(3)}${t.open ? "     OPEN SPACES " + String(t.open).padStart(3) : ""}`);
  L.push("=".repeat(96));
  L.push("");
  L.push(`${pad("#",4)}${pad("TRAILER #",11)}${pad("CUSTOMER / DELIVERY",22)}${pad("ORDER #",11)}${pad("DUE",7)}${pad("<1/2",5)}${pad("RET",4)}COMMENTS`);
  L.push("-".repeat(96));
  for (const e of rows){
    if (e.open){ L.push(`${pad(lineNo(e),4)}${pad("—",11)}${pad("",22)}${pad("",11)}${pad("",7)}${pad("",5)}${pad("",4)}open space${e.door?" at door "+e.door:""}`); continue; }
    L.push(`${pad(lineNo(e),4)}${pad(e.number,11)}${pad(e.destination,22)}${pad(e.order,11)}${pad(shortDate(e.due),7)}${pad(e.half?"X":"",5)}${pad(e.returns?"X":"",4)}${commentCell(e)}`);
  }
  const r = reconcile();
  L.push("", "-".repeat(96));
  L.push(`Trailers on the sheet: ${rows.length}`);
  if (r.prev){
    L.push(`New in: ${r.arrived.length}    Gone: ${r.gone.length}    Moved: ${r.moved.length}`);
    if (r.gone.length) L.push("Gone since " + dayLabel(r.prev).toLowerCase() + ": " + r.gone.map(e => e.number).join(", "));
  }
  const due = rows.filter(e => e.due && daysOut(e.due) <= 3);
  if (due.length) L.push("Due within 3 days: " + due.map(e => `${e.number} (${shortDate(e.due)})`).join(", "));
  const red = rows.filter(e => e.red);
  if (red.length){
    L.push("", "RED TAGGED");
    for (const e of red)
      L.push(`  ${e.number.padEnd(10)} ${(e.redWhy||"no reason given").padEnd(14)} ${placeText(e)}`);
  }
  const noread = rows.filter(e => e.paper === "noread");
  if (noread.length) L.push("Paperwork unreadable: " + noread.map(e => e.number).join(", "));
  return L.join("\n");
}
function download(name, text, type){
  const b = new Blob([text], {type:type||"text/plain"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

function openSheet(h){ $("#sheet").innerHTML = `<div class="grab"></div>` + h; $("#overlay").hidden = false; }
function closeSheet(){ $("#overlay").hidden = true; }

    ${e.photo ? `<img class="thumb big" src="${e.photo}" alt="">` : ""}
    <div class="card">
      <label class="f"><span class="lb">Trailer #</span><input name="eNum" class="mono" value="${esc(e.number)}"></label>
      ${k.load ? `
      <label class="f"><span class="lb">Paperwork</span><select name="ePaper">
        ${PAPER.map(p => `<option value="${p.id}" ${(e.paper||"got")===p.id?"selected":""}>${esc(p.label)}</option>`).join("")}
      </select></label>
      <label class="f"><span class="lb">Customer / delivery location</span><input name="eDest" value="${esc(e.destination)}"></label>
      <div class="grid2">
        <label class="f"><span class="lb">Order #</span><input name="eOrder" class="mono" value="${esc(e.order)}"></label>
        <label class="f"><span class="lb">Due date</span><input name="eDue" type="date" value="${esc(e.due)}"></label>
      </div>
      <label class="f"><span class="lb">Seal</span><input name="eSeal" class="mono" value="${esc(e.seal)}"></label>
      ` : `<div class="hint" style="margin-bottom:12px">${esc(k.label)} — no paperwork on this one.</div>`}
      <label class="f"><span class="lb">Comments</span><textarea name="eCom">${esc(e.comments||"")}</textarea></label>
      <div class="ticks" style="margin-bottom:12px">
        <button class="tick ${e.half?"on":""}" data-act="etick" data-id="${e.id}" data-t="half"><span class="box">✓</span>Less than ½ full</button>
        <button class="tick ${e.returns?"on":""}" data-act="etick" data-id="${e.id}" data-t="returns"><span class="box">✓</span>Returns</button>
      </div>

function modalRow(id){

  openSheet(`<h2>${esc(r.label)}</h2>
    <div class="sub">Learned from ${r.n||1} reading${(r.n||1)>1?"s":""} · ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div>
    <div class="card">
      <label class="f"><span class="lb">What do you call this part of the lot</span>

      <button class="btn" data-act="save-row" data-id="${r.id}">Save the name</button>
    </div>
    ${hist.length ? `<div class="eyebrow">Been parked here</div>` + hist.map(e =>
      `<div class="row ${kindOf(e.kind).cls}"><span class="body"><span class="t">${esc(e.number)}</span>
      <span class="s">${esc(dayLabel(e.date))} · ${esc(kindOf(e.kind).label)}</span></span>

const TABS = [
  { id:"walk",  label:"Walk",  icon:'<path d="M13 4.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><path d="M9 21l2-5 3-2-1-5-3 2-2 3M14 14l3 3 1 4"/>' },
  { id:"sheet", label:"Sheet", icon:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>' },
  { id:"check", label:"Check", icon:'<path d="M9 11l3 3 7-7"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
  { id:"map",   label:"Rows",  icon:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>' },
  { id:"log",   label:"Log",   icon:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/>' },
];

function render(){
  $("#view").innerHTML = { walk:viewWalk, sheet:viewSheet, check:viewCheck, map:viewMap, log:viewLog }[TAB]();
  const left = stillToCheck().length;
  $("#nav").innerHTML = TABS.map(t =>
    `<button data-act="tab" data-tab="${t.id}" class="${TAB===t.id?"on":""}">
      <svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}
      ${t.id==="check" && left ? `<span class="badge">${left>99?"99+":left}</span>` : ""}</button>`).join("");
  paintGPS(POS);
  if (CAM.on && CAM.stream){
    const v = $("#cam");
    if (v && !v.srcObject){ v.srcObject = CAM.stream; v.play().catch(()=>{}); }
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;

  switch(a){
    case "tab":
      if (b.dataset.tab !== "walk") closeCam();
      TAB = b.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "settings": modalSettings(); break;
    case "gps": {
      const secure = window.isSecureContext;
      openSheet(`<h2>Location</h2>
        <div class="sub">${POS ? "Good to about " + POS.acc + " metres." : esc(GPSMSG)}</div>
        ${!secure ? `<div class="warn"><b>This is the problem.</b><br>
          Phone browsers only hand out location to pages served over https. Opened straight from
          your downloads folder, this page can't have it — everything else works, but rows and
          moves won't record where you are.<br><br>
          Fix: put this one file on a free host (Netlify Drop, GitHub Pages, Cloudflare Pages),
          open the https link, then add <i>that</i> to your home screen.</div>` : ""}
        ${secure ? `<div class="hint" style="margin-bottom:14px">If it's stuck, check that location is
          on for your browser in phone settings, and that you're outside rather than in the cab
          under a metal roof.</div>` : ""}
        <div class="btnrow"><button class="btn" data-act="gps-retry">Try again</button></div>
        <div class="btnrow"><button class="btn ghost" data-act="close">Close</button></div>`);
      break;
    }
    case "gps-retry": closeSheet(); startGPS(); toast("Looking…"); break;

    case "key":
      if (b.dataset.k === "del") UI.digits = UI.digits.slice(0,-1);
      else if (UI.digits.length < 12) UI.digits += b.dataset.k;
      render(); break;
    case "commit": commit(); break;
    case "open-spot": commitOpen(); break;

    case "kind":  UI.kind = b.dataset.k; render(); break;
    case "paper": UI.paper = b.dataset.p; render(); break;
    case "place": UI.place = b.dataset.p; render(); break;
    case "door":  UI.place = "door"; UI.door = b.dataset.d; render(); break;
    case "tick":  UI[b.dataset.t] = !UI[b.dataset.t]; render(); break;
    case "setf":  UI[b.dataset.f] = b.dataset.v; render(); break;
    case "take-photo": {
      const inp = document.getElementById("photoinput");
      if (inp) inp.click(); else toast("No camera here");
      break;
    }
    case "read-tag": {
      const inp = document.getElementById("photoinput");
      if (!inp) return toast("No camera here");
      inp.dataset.mode = "ocr"; inp.click();
      break;
    }
    case "use-ocr": {
      const f = UI.ocr || {}, k = b.dataset.k;
      if (k === "all" || k === "order"){ if (f.order) UI.order = f.order; }
      if (k === "all" || k === "dest"){  if (f.dest)  UI.dest  = f.dest;  }
      if (k === "all" || k === "due"){   if (f.due)   UI.due   = f.due;   }
      closeSheet(); render(); toast("Filled in — check it");
      break;
    }
    case "ocr-raw":
      openSheet(`<h2>Raw text</h2><div class="sub">Everything the camera made out.</div>
        <pre class="out">${esc((UI.ocr && UI.ocr.raw) || "(nothing)")}</pre>
        <div class="btnrow"><button class="btn ghost" data-act="close">Close</button></div>`);
      break;
    case "drop-photo": UI.photo = null; render(); break;

    case "scan": openCam(); break;
    case "stopcam": closeCam(); render(); break;

    case "entry": modalEntry(id); break;
    case "begin-move": beginMove(id); break;
    case "move-number": beginMoveNumber(); break;
    case "drop": dropMove(null); break;
    case "cancel-move": cancelMove(); break;
    case "drop-door": {
      let h = `<h2>Which door</h2><div class="sub">${esc(S.move ? S.move.number : "")}</div><div class="chips">`;
      for (const d of doorList()){
        const occ = doorEntry(d);
        h += `<button class="chip" data-act="drop-at-door" data-d="${d}">${d}${
          occ ? ` <span style="color:var(--faint)">${esc(occ.number)}</span>` : ""}</button>`;
      }
      h += `</div><div class="btnrow"><button class="btn ghost" data-act="close">Cancel</button></div>`;
      openSheet(h); break;
    }
    case "drop-at-door": closeSheet(); dropMove(b.dataset.d); break;
    case "etick": {
      const en = S.entries.find(x => x.id === id); if (!en) break;
      en[b.dataset.t] = !en[b.dataset.t]; save(); modalEntry(id); break;
    }
    case "save-entry": {
      const en = S.entries.find(x => x.id === id); if (!en) break;
      en.number = val("eNum") || en.number;
      if (kindOf(en.kind).load){
        en.paper = val("ePaper") || en.paper || "got";
        en.destination = val("eDest"); en.order = val("eOrder");
        en.due = val("eDue"); en.seal = val("eSeal");
      }
      en.comments = document.querySelector('[name="eCom"]')?.value ?? en.comments;
      save(); closeSheet(); render(); toast("Saved"); break;
    }
    case "del-entry":
      S.entries = S.entries.filter(x => x.id !== id);
      save(); closeSheet(); render(); toast("Removed"); break;

    case "row": modalRow(id); break;
    case "save-row": {
      const r = rowById(id); if (!r) break;
      r.label = val("rLabel") || r.label;
      save(); closeSheet(); render(); toast("Renamed"); break;
    }
    case "del-row":
      for (const en of S.entries) if (en.rowId === id) en.rowId = null;
      S.rows = S.rows.filter(r => r.id !== id);
      save(); closeSheet(); render(); toast("Forgotten"); break;

    case "carry": {
      const prev = prevWalkDay(); if (!prev) break;
      const src = onDay(prev).find(e => e.number === b.dataset.n); if (!src) break;
      S.entries.push({ ...src, id:uid(), date:today(), at:Date.now(), carried:true });
      save(); render(); toast(b.dataset.n + " carried over"); break;
    }
    case "carry-all": {
      const todo = stillToCheck(); if (!todo.length) break;
      if (!confirm(`Carry all ${todo.length} over as unchanged?`)) break;
      for (const src of todo)
        S.entries.push({ ...src, id:uid(), date:today(), at:Date.now(), carried:true });
      save(); render(); toast(todo.length + " carried over"); break;
    }

    case "preview":
      openSheet(`<h2>Today's sheet</h2><div class="sub">Same columns as the paper form.</div>
        <pre class="out">${esc(sheetText())}</pre>
        <div class="btnrow"><button class="btn" data-act="txt">Save it</button></div>
        <div class="btnrow"><button class="btn ghost" data-act="close">Close</button></div>`);
      break;
    case "csv": download(`yardcheck-${today()}.csv`, csv(), "text/csv"); toast("Spreadsheet saved"); break;
    case "txt": download(`yardcheck-${today()}.txt`, sheetText()); toast("Sheet saved"); break;
    case "backup": download(`yardcheck-backup-${today()}.json`, JSON.stringify(S,null,2), "application/json");
      toast("Backup saved"); break;

    case "save-settings":
      S.plant = val("sPlant"); S.shift = val("sShift") || S.shift;
      const df = Number(val("sDoorFrom")), dt = Number(val("sDoorTo"));
      if (df >= 0 && dt >= df && dt - df < 200){ S.doorFrom = df; S.doorTo = dt; }
      save(); closeSheet(); render(); toast("Saved"); break;
    case "clear":
      if (!confirm("Delete every logged row? The learned rows stay.")) break;
      S.entries = []; save(); closeSheet(); render(); toast("Cleared"); break;
  }
});

document.addEventListener("change", async e => {
  if (e.target.id !== "photoinput") return;
  const file = e.target.files && e.target.files[0];
  const forOCR = e.target.dataset.mode === "ocr";
  e.target.dataset.mode = "";
  e.target.value = "";
  if (!file) return;
  toast(forOCR ? "Reading…" : "Reading photo…");
  const shot = await readPhoto(file, forOCR ? 1400 : 0);
  if (!shot) return toast("Couldn't read that photo");
  UI.photo = shot.small;
  if (forOCR){ render(); readTag(shot.big); }
  else { render(); toast("Photo attached"); }
});

document.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if (e.target.dataset.act === "field" && f){ UI[f] = e.target.value; return; }
  if (e.target.dataset.act === "search"){
    UI.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const box = document.querySelector('[data-act="search"]');
    if (box){ box.focus(); box.setSelectionRange(pos,pos); }
  }
});
document.addEventListener("click", e => { if (e.target.id === "overlay") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) closeCam(); });

load();
render();
startGPS();
</script>
