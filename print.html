<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yard Check — Print Sheet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#111;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#12100e;color:#f2ede4;padding:12px;display:flex;gap:8px;align-items:center}.toolbar b{flex:1;color:#ffb000;letter-spacing:.08em}.toolbar button{border:0;border-radius:8px;padding:11px 16px;font-weight:800;font-size:15px}.print{background:#ffb000;color:#111}.back{background:#2a2622;color:#fff}.page{width:8.5in;min-height:11in;margin:18px auto;background:#fff;padding:.38in;box-shadow:0 2px 14px #999}.title{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}.title h1{font-size:20px;margin:0}.meta{text-align:right;font-size:11px}.counts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0 12px}.count{border:1px solid #222;padding:6px;text-align:center}.count .n{font-size:20px;font-weight:800}.count .l{font-size:8px;text-transform:uppercase;letter-spacing:.05em}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px}th,td{border:1px solid #222;padding:4px 4px;vertical-align:top;overflow-wrap:anywhere}th{background:#eee;font-size:8px;text-transform:uppercase}th:nth-child(1){width:4%}th:nth-child(2){width:11%}th:nth-child(3){width:11%}th:nth-child(4){width:21%}th:nth-child(5){width:12%}th:nth-child(6){width:10%}th:nth-child(7){width:10%}th:nth-child(8){width:6%}th:nth-child(9){width:6%}th:nth-child(10){width:9%}.open{color:#777;font-style:italic}.red{font-weight:800}.empty{padding:30px;text-align:center;color:#555}.note{font-size:10px;color:#666;margin-top:8px}@media(max-width:900px){.page{width:100%;min-height:0;margin:0;box-shadow:none;padding:14px}.counts{grid-template-columns:repeat(3,1fr)}table{font-size:8px}}@media print{body{background:#fff}.toolbar{display:none!important}.page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}@page{size:letter portrait;margin:.32in}.counts{grid-template-columns:repeat(6,1fr)}table{font-size:8px}th,td{padding:3px}thead{display:table-header-group}tr{break-inside:avoid}.note{display:none}}
</style>
</head>
<body>
<div class="toolbar"><b>YARD CHECK · PRINT</b><button class="back" onclick="location.href='./'">Back</button><button class="print" onclick="window.print()">PRINT YARD SHEET</button></div>
<div class="page" id="page"></div>
<script>
'use strict';
const KEY='yardcheck-v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString():'';
const fmtTime=t=>t?new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
let S={plant:'',shift:'',entries:[],rows:[]};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const rows=(S.entries||[]).filter(e=>e.date===today());
const rowMap=new Map((S.rows||[]).map(r=>[r.id,r]));
const place=e=>e.door?'Door '+e.door:(e.rowId&&rowMap.get(e.rowId)?rowMap.get(e.rowId).label:'Lot');
const tally={loaded:0,roll:0,waste:0,empty:0,red:0,trailers:0};
rows.forEach(e=>{if(e.open)return;tally.trailers++;if(e.kind==='loaded')tally.loaded++;else if(e.kind==='roll')tally.roll++;else if(e.kind==='waste')tally.waste++;else if(e.kind==='empty')tally.empty++;if(e.red)tally.red++});
let h=`<div class="title"><h1>YARD CHECK — DAILY YARD SHEET</h1><div class="meta"><b>${esc(fmtDate(today()))}</b><br>${esc(S.shift||'')} ${S.plant?'· '+esc(S.plant):''}</div></div>`;
h+=`<div class="counts"><div class="count"><div class="n">${tally.loaded}</div><div class="l">Loaded</div></div><div class="count"><div class="n">${tally.roll}</div><div class="l">Roll stock</div></div><div class="count"><div class="n">${tally.waste}</div><div class="l">Waste</div></div><div class="count"><div class="n">${tally.empty}</div><div class="l">Empty</div></div><div class="count"><div class="n">${tally.red}</div><div class="l">Red tag</div></div><div class="count"><div class="n">${tally.trailers}</div><div class="l">Trailers</div></div></div>`;
if(!rows.length){h+='<div class="empty">No trailers are logged for today.</div>'}else{
h+='<table><thead><tr><th>#</th><th>Trailer</th><th>Type / Place</th><th>Customer / Delivery</th><th>Order #</th><th>Due</th><th>Comments</th><th>&lt; 1/2</th><th>Returns</th><th>Time</th></tr></thead><tbody>';
rows.forEach((e,i)=>{if(e.open){h+=`<tr class="open"><td>${i+1}</td><td>OPEN</td><td>${esc(place(e))}</td><td colspan="6">Open space</td><td>${esc(fmtTime(e.at))}</td></tr>`;return;}let comments=[];if(e.red)comments.push('RED TAG'+(e.redWhy?' — '+e.redWhy:''));if(e.seal)comments.push('Seal '+e.seal);if(e.paper==='noread')comments.push("Couldn't read paperwork");if(e.comments)comments.push(e.comments);h+=`<tr${e.red?' class="red"':''}><td>${i+1}</td><td><b>${esc(e.number)}</b></td><td>${esc((e.kind||'').replace('roll','Roll stock'))}<br>${esc(place(e))}</td><td>${esc(e.destination||'')}</td><td>${esc(e.order||'')}</td><td>${esc(fmtDate(e.due))}</td><td>${esc(comments.join('; '))}</td><td>${e.half?'✓':''}</td><td>${e.returns?'✓':''}</td><td>${esc(fmtTime(e.at))}</td></tr>`});
h+='</tbody></table>'}
h+='<div class="note">Tap PRINT YARD SHEET, then select the HP LaserJet Pro MFP 4101fdn in Android print services.</div>';
document.getElementById('page').innerHTML=h;
</script>
</body>
</html>
